name: QR-V Multi-Builder Development Lanes

on:
  push:
    branches:
      - work/chatgpt-sites
      - work/google-ai-studio
      - integration/multi-builder
  pull_request:
    branches:
      - integration/multi-builder
      - main

permissions:
  contents: read

concurrency:
  group: qrv-multi-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-development-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate builder lanes
        run: npm run check:lanes

      - name: Validate production compatibility
        run: npm run validate:prod
