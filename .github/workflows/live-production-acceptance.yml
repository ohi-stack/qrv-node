name: QR-V Live Production Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: qrv-live-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QRV_PLATFORM_URL: https://qrv.network
      QRV_API_URL: https://api.qrv.network
      QRV_CANONICAL_QRVID: QRV-PROD-CERT-000001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run live production acceptance
        run: npm run acceptance:live
